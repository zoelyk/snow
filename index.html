<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>滑雪場雪崩監控器 - Serial 穩定增強版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 3D 場景與視角設定 */
        .scene-viewport {
            perspective: 1200px;
            overflow: hidden;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
        }
        .world {
            position: relative;
            width: 500px;
            height: 800px;
            transform: rotateX(60deg) rotateY(10deg) rotateZ(-30deg);
            transform-style: preserve-3d;
            background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 100%);
            box-shadow: -20px 20px 50px rgba(0,0,0,0.15) inset, 30px 30px 40px rgba(0,0,0,0.2);
            border-radius: 10px;
            margin: -100px auto 0;
        }

        .piste {
            position: absolute;
            left: 20%;
            width: 60%;
            height: 100%;
            background: linear-gradient(to bottom right, rgba(255,255,255,0.8), rgba(255,255,255,0.3));
            border-left: 2px dashed #94a3b8;
            border-right: 2px dashed #94a3b8;
            box-shadow: inset 0 0 30px rgba(255,255,255,0.9);
        }

        .pole-container {
            position: absolute;
            width: 12px;
            height: 12px;
            transform-style: preserve-3d;
            cursor: pointer;
            z-index: 10;
        }
        .pole {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 10px;
            height: 60px;
            background: #64748b;
            transform-origin: bottom center;
            transform: rotateX(-90deg);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: inset -2px 0 4px rgba(0,0,0,0.3);
            border-radius: 2px;
        }
        
        .pole-container.fallen .pole {
            transform: rotateX(-175deg) rotateZ(15deg); 
            background: #cbd5e1;
        }

        .pole.special-1 { background: #ef4444; }
        .pole.special-2 { background: #3b82f6; }
        .pole.special-3 { background: #10b981; }

        #avalanche-wave {
            position: absolute;
            top: -600px;
            left: -50%;
            width: 200%;
            height: 600px;
            background: #ffffff;
            border-radius: 30% 40% 50% 40%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1), inset 0 -20px 50px #e2e8f0;
            transform: translateZ(30px) rotate(-10deg);
            opacity: 0;
            transition: top 2s cubic-bezier(0.4, 0, 0.8, 1), opacity 0.5s;
            pointer-events: none;
            z-index: 20;
        }
        #avalanche-wave.active { top: 1000px; opacity: 1; }

        .snow-boulder {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: inset -10px -15px 30px #cbd5e1;
        }
        .sb-1 { width: 200px; height: 200px; bottom: -80px; left: -10%; }
        .sb-2 { width: 280px; height: 280px; bottom: -120px; left: 15%; }
        .sb-3 { width: 240px; height: 240px; bottom: -100px; left: 45%; }
        .sb-4 { width: 200px; height: 200px; bottom: -110px; left: 70%; }
        .sb-5 { width: 160px; height: 160px; bottom: -70px; left: 90%; }

        #bottom-snow-pile {
            position: absolute;
            bottom: -350px;
            left: -20%;
            width: 140%;
            height: 300px;
            z-index: 30;
            pointer-events: none;
            transition: bottom 1.2s cubic-bezier(0.2, 0.8, 0.4, 1);
        }
        #bottom-snow-pile.active { bottom: -50px; }
        .pile-circle {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: inset 0px 20px 40px #e2e8f0;
        }
        .pc-1 { width: 350px; height: 350px; bottom: -120px; left: -5%; }
        .pc-2 { width: 450px; height: 450px; bottom: -180px; left: 25%; }
        .pc-3 { width: 380px; height: 380px; bottom: -150px; left: 65%; }

        .snow-particle {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 25;
            transition: top 1.5s cubic-bezier(0.4, 0, 0.9, 1), left 1.5s linear;
        }

        @keyframes flash-red {
            0%, 100% { background-color: rgba(239, 68, 68, 0.2); }
            50% { background-color: rgba(239, 68, 68, 0.6); }
        }
        .alarm-active { animation: flash-red 1s infinite; }

        .signal-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #94a3b8;
            transition: background-color 0.1s;
        }
        .signal-active { background-color: #10b981; box-shadow: 0 0 8px #10b981; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col font-sans">

    <header class="bg-white shadow-md p-6 text-center z-10 relative">
        <h1 class="text-3xl font-bold text-gray-800 mb-6 tracking-wide">⛷️ 滑雪場雪崩監控器</h1>
        <div class="flex flex-wrap justify-center items-center gap-4">
            <select id="mode-select" onchange="toggleMode()" class="bg-gray-100 border-2 border-gray-300 text-gray-800 font-bold py-2 px-4 rounded-xl shadow-sm cursor-pointer">
                <option value="virtual">電腦虛擬雪崩 (手動)</option>
                <option value="microbit">Microbit 模擬 (Serial)</option>
            </select>
            <div class="w-px h-8 bg-gray-300 mx-2 hidden sm:block"></div>
            <button onclick="connectMicrobit()" id="btn-microbit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-full shadow transition-colors flex items-center">
                連接 Microbit (Serial)
            </button>
        </div>
    </header>

    <main class="flex-grow relative flex flex-col items-center justify-center p-4">
        <div id="alarm-overlay" class="absolute inset-0 z-0 pointer-events-none transition-colors duration-300"></div>
        <div class="relative w-full max-w-5xl h-[600px] border-4 border-gray-300 rounded-2xl shadow-inner scene-viewport" id="scene-container">
            <div id="alarm-text" class="absolute top-10 left-0 right-0 text-center text-red-600 font-black text-5xl tracking-widest hidden z-50 drop-shadow-lg">
                ⚠️ 警報：檢測到雪崩！ ⚠️
            </div>
            <div class="world" id="world">
                <div class="piste"></div>
                <div id="avalanche-wave">
                    <div class="snow-boulder sb-1"></div>
                    <div class="snow-boulder sb-2"></div>
                    <div class="snow-boulder sb-3"></div>
                    <div class="snow-boulder sb-4"></div>
                    <div class="snow-boulder sb-5"></div>
                </div>
                <div id="bottom-snow-pile">
                    <div class="pile-circle pc-1"></div>
                    <div class="pile-circle pc-2"></div>
                    <div class="pile-circle pc-3"></div>
                </div>
            </div>
            <div class="absolute bottom-6 right-6 flex flex-col gap-3 z-20">
                <button id="btn-sim-avalanche" onclick="simulateAvalanche()" class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-6 rounded-xl shadow-lg disabled:opacity-50">
                    🌋 模擬雪崩
                </button>
                <button onclick="recoverAll()" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-xl shadow-lg">
                    🔄 復原場景
                </button>
            </div>
        </div>
    </main>

    <footer class="bg-white p-6 shadow-inner z-10">
        <div class="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
            <div id="card-1" class="bg-gray-50 border-l-8 border-red-500 rounded-lg p-5 shadow-md flex flex-col">
                <div class="flex items-center justify-between mb-3">
                    <div><h3 class="text-xl font-bold text-gray-800">Pole 1</h3></div>
                    <div class="status-badge bg-green-100 text-green-700 px-4 py-2 rounded-full font-bold">直立</div>
                </div>
                <div class="bg-gray-200 rounded p-2 flex flex-col gap-1">
                    <div class="flex items-center justify-between">
                        <span id="log-1" class="text-sm font-mono font-bold truncate">無訊號</span>
                        <div id="dot-1" class="signal-dot ml-2"></div>
                    </div>
                </div>
            </div>
            <div id="card-2" class="bg-gray-50 border-l-8 border-blue-500 rounded-lg p-5 shadow-md flex flex-col">
                <div class="flex items-center justify-between mb-3">
                    <div><h3 class="text-xl font-bold text-gray-800">Pole 2</h3></div>
                    <div class="status-badge bg-green-100 text-green-700 px-4 py-2 rounded-full font-bold">直立</div>
                </div>
                <div class="bg-gray-200 rounded p-2 flex flex-col gap-1">
                    <div class="flex items-center justify-between">
                        <span id="log-2" class="text-sm font-mono font-bold truncate">無訊號</span>
                        <div id="dot-2" class="signal-dot ml-2"></div>
                    </div>
                </div>
            </div>
            <div id="card-3" class="bg-gray-50 border-l-8 border-green-500 rounded-lg p-5 shadow-md flex flex-col">
                <div class="flex items-center justify-between mb-3">
                    <div><h3 class="text-xl font-bold text-gray-800">Pole 3</h3></div>
                    <div class="status-badge bg-green-100 text-green-700 px-4 py-2 rounded-full font-bold">直立</div>
                </div>
                <div class="bg-gray-200 rounded p-2 flex flex-col gap-1">
                    <div class="flex items-center justify-between">
                        <span id="log-3" class="text-sm font-mono font-bold truncate">無訊號</span>
                        <div id="dot-3" class="signal-dot ml-2"></div>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script>
        const state = {
            poles: [],
            isAvalanche: false,
            alarmInterval: null,
            audioCtx: null,
            currentMode: 'virtual',
            serialPort: null,
            serialBuffer: '',
            pileTimer: null, // 加入底部雪堆計時器狀態
            // 用於儲存每個支柱最後一次切換狀態的時間，防止快速抖動
            lastToggleTime: { 1: 0, 2: 0, 3: 0 } 
        };

        const SPECIAL_POLES = { 'L-2': 1, 'R-4': 2, 'L-6': 3 };

        function initScene() {
            const world = document.getElementById('world');
            const poles = [
                {x: 50, y: 80, side: 'L'}, {x: 430, y: 80, side: 'R'},
                {x: 50, y: 170, side: 'L'}, {x: 430, y: 170, side: 'R'},
                {x: 50, y: 260, side: 'L'}, {x: 430, y: 260, side: 'R'},
                {x: 50, y: 350, side: 'L'}, {x: 430, y: 350, side: 'R'},
                {x: 50, y: 440, side: 'L'}, {x: 430, y: 440, side: 'R'},
                {x: 50, y: 530, side: 'L'}, {x: 430, y: 530, side: 'R'},
                {x: 50, y: 620, side: 'L'}, {x: 430, y: 620, side: 'R'},
                {x: 50, y: 710, side: 'L'}, {x: 430, y: 710, side: 'R'}
            ];
            poles.forEach((p, i) => {
                const id = `${p.side}-${Math.floor(i/2)}`;
                createPoleElement(world, id, p.x, p.y);
            });
            updateCards();
        }

        function createPoleElement(parent, id, x, y) {
            const container = document.createElement('div');
            container.className = 'pole-container';
            container.style.left = `${x}px`;
            container.style.top = `${y}px`;
            const pole = document.createElement('div');
            pole.className = 'pole';
            let specialId = SPECIAL_POLES[id] || null;
            if (specialId) pole.classList.add(`special-${specialId}`);
            container.appendChild(pole);
            parent.appendChild(container);
            
            // 增加 avalancheTimer，用來記錄雪崩動畫的倒塌計時器
            state.poles.push({ id, element: container, isFallen: false, specialId, recoverTimer: null, avalancheTimer: null });
            
            container.onclick = () => {
                if (state.currentMode === 'virtual' && !state.isAvalanche) knockDownPole(state.poles.find(p=>p.id===id));
            };
        }

        function toggleMode() {
            state.currentMode = document.getElementById('mode-select').value;
            document.getElementById('btn-sim-avalanche').disabled = state.currentMode === 'microbit';
            recoverAll();
        }

        function knockDownPole(p) {
            if (p.isFallen) return;
            p.isFallen = true;
            p.element.classList.add('fallen');
            updateCards();
            checkGlobalAlarm();
            if (state.currentMode === 'virtual') {
                if (p.recoverTimer) clearTimeout(p.recoverTimer);
                p.recoverTimer = setTimeout(() => { if(!state.isAvalanche) standUpPole(p); }, 5000);
            }
        }

        function standUpPole(p) {
            if (!p.isFallen) return;
            p.isFallen = false;
            p.element.classList.remove('fallen');
            updateCards();
            checkGlobalAlarm();
        }

        function updateCards() {
            state.poles.filter(p => p.specialId).forEach(p => {
                const badge = document.querySelector(`#card-${p.specialId} .status-badge`);
                badge.textContent = p.isFallen ? '倒下' : '直立';
                badge.className = `status-badge px-4 py-2 rounded-full font-bold ${p.isFallen ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`;
            });
        }

        function checkGlobalAlarm() {
            if (state.isAvalanche) return;
            const specialFallen = state.poles.filter(p => p.specialId && p.isFallen).length;
            if (state.currentMode === 'microbit' && specialFallen >= 3) simulateAvalanche();
            else if (state.currentMode === 'virtual' && state.poles.filter(p=>p.isFallen).length >= 6) triggerAlarm();
        }

        function simulateAvalanche() {
            if (state.isAvalanche) return;
            state.isAvalanche = true;
            document.getElementById('avalanche-wave').classList.add('active');
            
            if (state.pileTimer) clearTimeout(state.pileTimer);
            state.pileTimer = setTimeout(() => document.getElementById('bottom-snow-pile').classList.add('active'), 1000);
            
            state.poles.forEach(p => {
                if (p.avalancheTimer) clearTimeout(p.avalancheTimer); // 防呆
                const delay = (parseInt(p.element.style.top) / 800) * 1500 + 200;
                p.avalancheTimer = setTimeout(() => knockDownPole(p), delay); // 記錄下這個計時器
            });
            triggerAlarm();
        }

        function recoverAll() {
            state.isAvalanche = false;
            stopAlarm();
            
            // 移除動畫特效
            document.getElementById('avalanche-wave').classList.remove('active');
            document.getElementById('bottom-snow-pile').classList.remove('active');
            if (state.pileTimer) clearTimeout(state.pileTimer);
            document.querySelectorAll('.avalanche-debris').forEach(el => el.remove());
            
            // 強制清除所有支柱正在進行的幽靈動畫計時器
            state.poles.forEach(p => {
                if (p.avalancheTimer) {
                    clearTimeout(p.avalancheTimer);
                    p.avalancheTimer = null;
                }
                if (p.recoverTimer) {
                    clearTimeout(p.recoverTimer);
                    p.recoverTimer = null;
                }
                standUpPole(p);
            });
        }

        function triggerAlarm() {
            if (state.alarmInterval) return;
            document.getElementById('alarm-overlay').classList.add('alarm-active');
            document.getElementById('alarm-text').classList.remove('hidden');
            if (!state.audioCtx) state.audioCtx = new AudioContext();
            state.alarmInterval = setInterval(() => {
                const o = state.audioCtx.createOscillator();
                const g = state.audioCtx.createGain();
                o.type = 'square';
                o.frequency.setValueAtTime(800, state.audioCtx.currentTime);
                g.gain.setValueAtTime(0.05, state.audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, state.audioCtx.currentTime + 0.4);
                o.connect(g); g.connect(state.audioCtx.destination);
                o.start(); o.stop(state.audioCtx.currentTime + 0.4);
            }, 800);
        }

        function stopAlarm() {
            clearInterval(state.alarmInterval);
            state.alarmInterval = null;
            document.getElementById('alarm-overlay').classList.remove('alarm-active');
            document.getElementById('alarm-text').classList.add('hidden');
        }

        async function connectMicrobit() {
            try {
                const port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                state.serialPort = port;
                document.getElementById('btn-microbit').textContent = '✅ 已連接';
                const reader = port.readable.pipeThrough(new TextDecoderStream()).getReader();
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    handleSerialData(value);
                }
            } catch (e) { alert('Serial 連接失敗'); }
        }

        function handleSerialData(chunk) {
            if (state.currentMode !== 'microbit') return;
            state.serialBuffer += chunk;
            let lines = state.serialBuffer.split(/\r?\n/);
            state.serialBuffer = lines.pop();

            const now = Date.now();

            lines.forEach(line => {
                const raw = line.trim();
                if (!raw) return;
                const text = raw.toLowerCase();

                [1, 2, 3].forEach(id => {
                    const pole = state.poles.find(p => p.specialId === id);
                    if (!pole) return;

                    const isDown = new RegExp(`${id}\\s*down`).test(text);
                    const isUp = new RegExp(`${id}\\s*up`).test(text);

                    if (isDown || isUp) {
                        // 抗抖動限制：200ms 內不接受重複切換
                        if (now - state.lastToggleTime[id] < 200) return;

                        document.getElementById(`log-${id}`).textContent = raw.toUpperCase();
                        const dot = document.getElementById(`dot-${id}`);
                        dot.classList.add('signal-active');
                        setTimeout(() => dot.classList.remove('signal-active'), 100);

                        if (isDown && !pole.isFallen && !state.isAvalanche) {
                            knockDownPole(pole);
                            state.lastToggleTime[id] = now;
                        } else if (isUp && pole.isFallen) {
                            standUpPole(pole);
                            state.lastToggleTime[id] = now;
                        }
                    }
                });
            });
        }

        window.onload = initScene;
    </script>
</body>
</html>
