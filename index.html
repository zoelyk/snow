<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>滑雪場雪崩監控器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 3D 場景與視角設定 */
        .scene-viewport {
            perspective: 1200px;
            overflow: hidden;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
        }
        .world {
            position: relative;
            width: 500px;
            height: 800px;
            /* 45度角高空俯視感，並將左方抬高形成明顯斜坡 */
            transform: rotateX(60deg) rotateY(10deg) rotateZ(-30deg);
            transform-style: preserve-3d;
            background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 100%);
            box-shadow: -20px 20px 50px rgba(0,0,0,0.15) inset, 30px 30px 40px rgba(0,0,0,0.2);
            border-radius: 10px;
            margin: -100px auto 0;
        }

        /* 雪道裝飾 */
        .piste {
            position: absolute;
            left: 20%;
            width: 60%;
            height: 100%;
            background: linear-gradient(to bottom right, rgba(255,255,255,0.8), rgba(255,255,255,0.3));
            border-left: 2px dashed #94a3b8;
            border-right: 2px dashed #94a3b8;
            box-shadow: inset 0 0 30px rgba(255,255,255,0.9);
        }

        /* 支柱基本樣式 */
        .pole-container {
            position: absolute;
            width: 12px;
            height: 12px;
            transform-style: preserve-3d;
            cursor: pointer;
            z-index: 10;
        }
        .pole {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 10px;
            height: 60px;
            background: #64748b;
            transform-origin: bottom center;
            /* 修正角度使其在3D空間中直立 */
            transform: rotateX(-90deg);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: inset -2px 0 4px rgba(0,0,0,0.3);
            border-radius: 2px;
        }
        
        /* 倒塌狀態 */
        .pole-container.fallen .pole {
            transform: rotateX(-175deg) rotateZ(15deg); /* 順著斜坡向下跌，並帶一點側翻 */
            background: #e2e8f0; /* 被雪覆蓋變淺色 */
        }

        /* 特殊支柱顏色 */
        .pole.special-1 { background: #ef4444; } /* 紅色 */
        .pole.special-2 { background: #3b82f6; } /* 藍色 */
        .pole.special-3 { background: #10b981; } /* 綠色 */

        /* 雪崩特效 - 巨型主雪堆 */
        #avalanche-wave {
            position: absolute;
            top: -600px;
            left: -50%;
            width: 200%;
            height: 600px;
            background: #ffffff;
            border-radius: 30% 40% 50% 40%;
            box-shadow: 
                0 20px 40px rgba(0,0,0,0.1),
                inset 0 -20px 50px #e2e8f0,
                0 80px 100px rgba(255,255,255,0.9);
            transform: translateZ(30px) rotate(-10deg);
            opacity: 0;
            transition: top 2s cubic-bezier(0.4, 0, 0.8, 1), opacity 0.5s;
            pointer-events: none;
            z-index: 20;
        }
        #avalanche-wave.active {
            top: 1000px; /* 衝過整個滑雪道 */
            opacity: 1;
        }

        /* 雪崩前緣滾動的圓形雪球 */
        .snow-boulder {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: inset -10px -15px 30px #cbd5e1, 0 15px 20px rgba(0,0,0,0.1);
        }
        .sb-1 { width: 200px; height: 200px; bottom: -80px; left: -10%; }
        .sb-2 { width: 280px; height: 280px; bottom: -120px; left: 15%; }
        .sb-3 { width: 240px; height: 240px; bottom: -100px; left: 45%; }
        .sb-4 { width: 200px; height: 200px; bottom: -110px; left: 70%; }
        .sb-5 { width: 160px; height: 160px; bottom: -70px; left: 90%; }

        /* 底部雪粒累積 (隆起的雪堆) */
        #bottom-snow-pile {
            position: absolute;
            bottom: -350px; /* 初始隱藏在底部 */
            left: -20%;
            width: 140%;
            height: 300px;
            z-index: 30; /* 覆蓋在柱子上方 */
            pointer-events: none;
            transition: bottom 1.2s cubic-bezier(0.2, 0.8, 0.4, 1);
        }
        #bottom-snow-pile.active {
            bottom: -50px; /* 雪崩抵達時隆起 */
        }
        .pile-circle {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: inset 0px 20px 40px #e2e8f0, 0 -10px 20px rgba(0,0,0,0.05);
        }
        .pc-1 { width: 350px; height: 350px; bottom: -120px; left: -5%; }
        .pc-2 { width: 450px; height: 450px; bottom: -180px; left: 25%; }
        .pc-3 { width: 380px; height: 380px; bottom: -150px; left: 65%; }

        /* 飛濺的碎雪塊 */
        .snow-particle {
            position: absolute;
            background: radial-gradient(circle, #ffffff 40%, rgba(255,255,255,0.8) 100%);
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            pointer-events: none;
            z-index: 25;
            transition: top 1.5s cubic-bezier(0.4, 0, 0.9, 1), left 1.5s linear;
        }

        /* 警報閃爍特效 */
        @keyframes flash-red {
            0%, 100% { background-color: rgba(239, 68, 68, 0.2); }
            50% { background-color: rgba(239, 68, 68, 0.6); }
        }
        .alarm-active {
            animation: flash-red 1s infinite;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col font-sans">

    <!-- 頂部標題與連接按鈕 -->
    <header class="bg-white shadow-md p-6 text-center z-10 relative">
        <h1 class="text-3xl font-bold text-gray-800 mb-6 tracking-wide">⛷️ 滑雪場雪崩監控器</h1>
        <div class="flex flex-wrap justify-center items-center gap-4">
            
            <!-- 新增：模式選擇下拉選單 -->
            <select id="mode-select" onchange="toggleMode()" class="bg-gray-100 border-2 border-gray-300 text-gray-800 font-bold py-2 px-4 rounded-xl shadow-sm focus:outline-none focus:border-blue-500 transition-colors cursor-pointer">
                <option value="virtual">電腦虛擬雪崩</option>
                <option value="microbit">Microbit模擬</option>
            </select>
            <div class="w-px h-8 bg-gray-300 mx-2 hidden sm:block"></div> <!-- 分隔線 -->

            <button onclick="connectMicrobit()" id="btn-microbit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-full shadow transition-colors flex items-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                連接 Microbit
            </button>
        </div>
    </header>

    <!-- 互動場景區塊 -->
    <main class="flex-grow relative flex flex-col items-center justify-center p-4">
        
        <!-- 全局警報覆蓋層 -->
        <div id="alarm-overlay" class="absolute inset-0 z-0 pointer-events-none transition-colors duration-300"></div>

        <div class="relative w-full max-w-5xl h-[600px] border-4 border-gray-300 rounded-2xl shadow-inner scene-viewport" id="scene-container">
            
            <div id="alarm-text" class="absolute top-10 left-0 right-0 text-center text-red-600 font-black text-5xl tracking-widest hidden z-50 drop-shadow-lg">
                ⚠️ 警報：檢測到雪崩！ ⚠️
            </div>

            <!-- 3D 空間 -->
            <div class="world" id="world">

                <div class="piste"></div>
                
                <!-- 雪崩主波浪與前緣雪粒(圓形) -->
                <div id="avalanche-wave">
                    <div class="snow-boulder sb-1"></div>
                    <div class="snow-boulder sb-2"></div>
                    <div class="snow-boulder sb-3"></div>
                    <div class="snow-boulder sb-4"></div>
                    <div class="snow-boulder sb-5"></div>
                </div>

                <!-- 支柱將透過 JavaScript 動態生成在這裡 -->

                <!-- 底部雪崩累積層 -->
                <div id="bottom-snow-pile">
                    <div class="pile-circle pc-1"></div>
                    <div class="pile-circle pc-2"></div>
                    <div class="pile-circle pc-3"></div>
                </div>

            </div>

            <!-- 右下角控制按鈕 -->
            <div class="absolute bottom-6 right-6 flex flex-col gap-3 z-20">
                <button id="btn-sim-avalanche" onclick="simulateAvalanche()" class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-6 rounded-xl shadow-lg transform transition hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100">
                    🌋 模擬雪崩
                </button>
                <button onclick="recoverAll()" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-xl shadow-lg transform transition hover:scale-105">
                    🔄 復原場景
                </button>
            </div>
        </div>
    </main>

    <!-- 下方狀態卡片區 -->
    <footer class="bg-white p-6 shadow-inner z-10">
        <div class="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- 咭牌 1 -->
            <div id="card-1" class="bg-gray-50 border-l-8 border-red-500 rounded-lg p-6 shadow-md transition-all duration-300 flex items-center justify-between">
                <div>
                    <h3 class="text-xl font-bold text-gray-800">Pole 1</h3>
                    <p class="text-sm text-gray-500">左側監測點</p>
                </div>
                <div class="status-badge bg-green-100 text-green-700 px-4 py-2 rounded-full font-bold text-lg">
                    直立
                </div>
            </div>
            <!-- 咭牌 2 -->
            <div id="card-2" class="bg-gray-50 border-l-8 border-blue-500 rounded-lg p-6 shadow-md transition-all duration-300 flex items-center justify-between">
                <div>
                    <h3 class="text-xl font-bold text-gray-800">Pole 2</h3>
                    <p class="text-sm text-gray-500">右側監測點</p>
                </div>
                <div class="status-badge bg-green-100 text-green-700 px-4 py-2 rounded-full font-bold text-lg">
                    直立
                </div>
            </div>
            <!-- 咭牌 3 -->
            <div id="card-3" class="bg-gray-50 border-l-8 border-green-500 rounded-lg p-6 shadow-md transition-all duration-300 flex items-center justify-between">
                <div>
                    <h3 class="text-xl font-bold text-gray-800">Pole 3</h3>
                    <p class="text-sm text-gray-500">左側深處監測點</p>
                </div>
                <div class="status-badge bg-green-100 text-green-700 px-4 py-2 rounded-full font-bold text-lg">
                    直立
                </div>
            </div>
        </div>
    </footer>

    <script>
        // 系統狀態
        const state = {
            poles: [], // 儲存所有支柱狀態
            isAvalanche: false,
            alarmInterval: null,
            audioCtx: null,
            pileTimer: null, // 底部積雪計時器
            currentMode: 'virtual' // 新增模式狀態：'virtual' 或 'microbit'
        };

        // Microbit UART 服務 UUID 設定 (用於接收廣播文字)
        const UART_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
        const UART_TX_CHARACTERISTIC_UUID = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

        // 支柱設定
        const POLE_COUNT_PER_SIDE = 8;
        const SPECIAL_POLES = {
            'L-2': { id: 1, name: 'Pole 1', colorClass: 'special-1' }, // 左側第3支
            'R-4': { id: 2, name: 'Pole 2', colorClass: 'special-2' }, // 右側第5支
            'L-6': { id: 3, name: 'Pole 3', colorClass: 'special-3' }  // 左側第7支
        };

        // 初始化場景
        function initScene() {
            const world = document.getElementById('world');
            const leftX = 50;  // 左側相對於world的X座標
            const rightX = 430; // 右側相對於world的X座標
            const startY = 80;  // 起始Y座標 (稍微往下移以留出空間給雪山)
            const spacingY = 90; // 支柱間距

            for (let i = 0; i < POLE_COUNT_PER_SIDE; i++) {
                // 左側支柱
                createPoleElement(world, `L-${i}`, leftX, startY + (i * spacingY));
                // 右側支柱
                createPoleElement(world, `R-${i}`, rightX, startY + (i * spacingY));
            }
            updateCards();
        }

        // 建立支柱DOM
        function createPoleElement(parent, id, x, y) {
            const container = document.createElement('div');
            container.className = 'pole-container';
            container.style.left = `${x}px`;
            container.style.top = `${y}px`;
            
            const pole = document.createElement('div');
            pole.className = 'pole';
            
            // 檢查是否為特殊支柱
            let isSpecial = false;
            let specialId = null;
            if (SPECIAL_POLES[id]) {
                pole.classList.add(SPECIAL_POLES[id].colorClass);
                isSpecial = true;
                specialId = SPECIAL_POLES[id].id;
            }

            container.appendChild(pole);
            parent.appendChild(container);

            // 儲存狀態
            const poleData = {
                id: id,
                element: container,
                isFallen: false,
                isSpecial: isSpecial,
                specialId: specialId,
                recoverTimer: null
            };
            state.poles.push(poleData);

            // 點擊事件 (單支倒塌)
            container.addEventListener('click', () => {
                // Microbit 模式下禁止手動點擊支柱
                if (state.currentMode === 'virtual' && !state.isAvalanche && !poleData.isFallen) {
                    knockDownPole(poleData);
                }
            });
        }

        // 新增：切換模式功能
        function toggleMode() {
            state.currentMode = document.getElementById('mode-select').value;
            const simBtn = document.getElementById('btn-sim-avalanche');
            
            if (state.currentMode === 'microbit') {
                simBtn.disabled = true; // Microbit 模式下禁用手動模擬按鈕
                recoverAll(); // 切換時自動將場景復原直立
            } else {
                simBtn.disabled = false;
            }
        }

        // 擊倒單一橫桿
        function knockDownPole(poleData) {
            poleData.isFallen = true;
            poleData.element.classList.add('fallen');
            
            if (poleData.isSpecial) updateCards();
            checkGlobalAlarm();

            // 虛擬模式下：5秒後自動復原
            // Microbit模式下：不會自動復原，須等待 'up' 指令
            if (state.currentMode === 'virtual') {
                if (poleData.recoverTimer) clearTimeout(poleData.recoverTimer);
                poleData.recoverTimer = setTimeout(() => {
                    if (!state.isAvalanche) {
                        standUpPole(poleData);
                    }
                }, 5000);
            }
        }

        // 立起單一橫桿
        function standUpPole(poleData) {
            poleData.isFallen = false;
            poleData.element.classList.remove('fallen');
            if (poleData.isSpecial) updateCards();
            checkGlobalAlarm();
        }

        // 更新下方卡片 UI
        function updateCards() {
            state.poles.filter(p => p.isSpecial).forEach(p => {
                const card = document.getElementById(`card-${p.specialId}`);
                const badge = card.querySelector('.status-badge');
                
                if (p.isFallen) {
                    badge.textContent = '倒下';
                    badge.className = 'status-badge bg-red-100 text-red-700 px-4 py-2 rounded-full font-bold text-lg';
                    card.classList.add('bg-red-50');
                } else {
                    badge.textContent = '直立';
                    badge.className = 'status-badge bg-green-100 text-green-700 px-4 py-2 rounded-full font-bold text-lg';
                    card.classList.remove('bg-red-50');
                }
            });
        }

        // 檢查是否需要觸發全局警報 (大規模倒塌)
        function checkGlobalAlarm() {
            if (state.isAvalanche) return; // 已經在雪崩狀態就不重複觸發
            
            if (state.currentMode === 'microbit') {
                // Microbit 模式：當 3 支特殊支柱都倒下，觸發雪崩動畫及警告
                const specialFallenCount = state.poles.filter(p => p.isSpecial && p.isFallen).length;
                if (specialFallenCount >= 3) {
                    simulateAvalanche();
                }
            } else {
                // 虛擬模式：如果超過 6 支柱子同時倒下，視為雪崩警報
                const fallenCount = state.poles.filter(p => p.isFallen).length;
                if (fallenCount >= 6) {
                    triggerAlarm();
                } else if (fallenCount < 6 && state.alarmInterval) {
                    stopAlarm();
                }
            }
        }

        // 模擬雪崩按鈕
        function simulateAvalanche() {
            if (state.isAvalanche) return;
            state.isAvalanche = true;
            
            // 觸發雪崩視覺特效 (巨型波浪及圓球前緣)
            const wave = document.getElementById('avalanche-wave');
            wave.style.transition = 'none';
            wave.style.top = '-600px';
            
            // 強制重繪
            void wave.offsetWidth;

            wave.style.transition = 'top 2s cubic-bezier(0.4, 0, 0.8, 1), opacity 0.3s';
            wave.classList.add('active');

            // 產生從雪山上大量湧下的飛濺雪塊
            const world = document.getElementById('world');
            for(let i=0; i<60; i++) {
                const particle = document.createElement('div');
                particle.className = 'snow-particle avalanche-debris';
                const size = Math.random() * 60 + 20; // 20px 到 80px 不等的雪塊
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${Math.random() * 120 - 10}%`; 
                // 將起始位置設定得更高，模擬從雪山跌落
                particle.style.top = `${-200 - Math.random() * 400}px`; 
                
                // 給雪塊加上隨機的高度(Z軸)讓其在空中飛舞
                const zOffset = Math.random() * 150 + 10;
                particle.style.transform = `translateZ(${zOffset}px)`;
                
                world.appendChild(particle);

                // 觸發雪塊掉落動畫
                setTimeout(() => {
                    particle.style.top = `${1000 + Math.random() * 300}px`;
                    particle.style.left = `calc(${particle.style.left} + ${Math.random() * 60 - 30}%)`;
                }, 50);
            }

            // 觸發底部雪粒累積 (延遲1.2秒，模擬雪波剛好衝到底部的時機)
            if (state.pileTimer) clearTimeout(state.pileTimer);
            state.pileTimer = setTimeout(() => {
                document.getElementById('bottom-snow-pile').classList.add('active');
            }, 1200);

            // 依序推倒柱子 (模擬由上往下的真實衝擊)
            state.poles.forEach((p, index) => {
                if (p.recoverTimer) clearTimeout(p.recoverTimer);
                
                // 根據 Y 座標計算延遲，讓上方的柱子先倒
                const yPos = parseInt(p.element.style.top);
                const delay = (yPos / 800) * 1200 + 300; 

                setTimeout(() => {
                    p.isFallen = true;
                    p.element.classList.add('fallen');
                    if (p.isSpecial) updateCards();
                }, delay);
            });

            // 立即觸發警報
            setTimeout(triggerAlarm, 500);
        }

        // 復原場景按鈕
        function recoverAll() {
            state.isAvalanche = false;
            stopAlarm();
            
            // 收起雪崩波浪
            const wave = document.getElementById('avalanche-wave');
            wave.classList.remove('active');
            
            // 收起底部積雪
            if (state.pileTimer) clearTimeout(state.pileTimer);
            document.getElementById('bottom-snow-pile').classList.remove('active');

            // 清除飛濺的碎雪
            const debris = document.querySelectorAll('.avalanche-debris');
            debris.forEach(el => el.remove());
            
            // 恢復所有柱子
            state.poles.forEach(p => {
                if (p.recoverTimer) clearTimeout(p.recoverTimer);
                standUpPole(p);
            });
        }

        // 初始化 Web Audio API 用於警報聲
        function initAudio() {
            if (!state.audioCtx) {
                state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // 播放一次嗶聲
        function playBeep() {
            if (!state.audioCtx) return;
            const osc = state.audioCtx.createOscillator();
            const gain = state.audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(800, state.audioCtx.currentTime);
            osc.frequency.setValueAtTime(1200, state.audioCtx.currentTime + 0.1);
            
            gain.gain.setValueAtTime(0.1, state.audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, state.audioCtx.currentTime + 0.4);
            
            osc.connect(gain);
            gain.connect(state.audioCtx.destination);
            osc.start();
            osc.stop(state.audioCtx.currentTime + 0.4);
        }

        // 觸發警報
        function triggerAlarm() {
            if (state.alarmInterval) return;
            initAudio();
            
            document.getElementById('alarm-overlay').classList.add('alarm-active');
            document.getElementById('scene-container').classList.add('border-red-500');
            document.getElementById('alarm-text').classList.remove('hidden');
            
            playBeep();
            state.alarmInterval = setInterval(playBeep, 800);
        }

        // 停止警報
        function stopAlarm() {
            if (state.alarmInterval) {
                clearInterval(state.alarmInterval);
                state.alarmInterval = null;
            }
            document.getElementById('alarm-overlay').classList.remove('alarm-active');
            document.getElementById('scene-container').classList.remove('border-red-500');
            document.getElementById('alarm-text').classList.add('hidden');
        }

        // 模擬藍牙連接 Micro:bit
        async function connectMicrobit() {
            try {
                // 要求使用者在瀏覽器中選擇藍牙裝置
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'BBC micro:bit' }],
                    optionalServices: [UART_SERVICE_UUID] 
                });
                
                // 連線到 GATT 伺服器並獲取 UART 服務
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(UART_SERVICE_UUID);
                const characteristic = await service.getCharacteristic(UART_TX_CHARACTERISTIC_UUID);
                
                // 啟動通知以接收 Microbit 廣播文字
                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', handleMicrobitData);
                
                alert(`成功連接至裝置: ${device.name}\n系統現已可接收 "1 Down", "2 Down", "3 Down" 等藍牙廣播。`);
                
                // 更新按鈕 UI
                const btn = document.getElementById(`btn-microbit`);
                btn.classList.replace('bg-blue-600', 'bg-green-600');
                btn.classList.replace('hover:bg-blue-700', 'hover:bg-green-700');
                btn.innerHTML = `<svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> 已連接 Microbit`;
                
            } catch (error) {
                console.log(error);
                // 提供回饋 (使用者取消或無藍牙硬體)
                alert(`連接取消或失敗。請確認您的設備支援 Web Bluetooth 且 Micro:bit 已開啟配對模式。\n\n詳細錯誤: ${error.message}`);
            }
        }

        // 新增：處理接收到的 Microbit 藍牙資料
        function handleMicrobitData(event) {
            if (state.currentMode !== 'microbit') return; // 只在 Microbit 模式下生效

            const value = event.target.value;
            const decoder = new TextDecoder('utf-8');
            const text = decoder.decode(value).trim().toLowerCase(); 
            
            console.log(`收到 Microbit 廣播: ${text}`);

            // 解析並執行指令 ("1 down", "1 up", 等)
            const specialPolesIds = [1, 2, 3];
            specialPolesIds.forEach(id => {
                const poleData = state.poles.find(p => p.specialId === id);
                if (!poleData) return;

                if (text.includes(`${id} down`)) {
                    // 若支柱直立且目前尚未發生大雪崩，則讓其倒下
                    if (!poleData.isFallen && !state.isAvalanche) {
                        knockDownPole(poleData);
                    }
                } else if (text.includes(`${id} up`)) {
                    // 若支柱倒下，則讓其重新直立
                    if (poleData.isFallen) {
                        standUpPole(poleData);
                    }
                }
            });
        }

        // 網頁載入後初始化
        window.addEventListener('DOMContentLoaded', initScene);

    </script>
</body>
